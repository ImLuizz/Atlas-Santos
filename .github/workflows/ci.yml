name: CI — Atlas Santos Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-quality:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check format with Ruff
        run: |
          ruff format --check .

      - name: Validate migrations against PostgreSQL
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://atlas_ci:atlas_ci@localhost:5432/atlas_ci
        run: |
          alembic upgrade head
          alembic check

      - name: Run Pytest suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-32-chars-long!!
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest --maxfail=1 --disable-warnings -v

  frontend-quality:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Run Vitest suite
        run: npm run test:run

      - name: Build application
        run: npm run build

