name: atlas-santos

x-backend: &backend
  build:
    context: ./backend
    dockerfile_inline: |
      FROM python:3.12-slim
      WORKDIR /app
      COPY pyproject.toml .
      COPY app app
      RUN pip install --no-cache-dir .
  working_dir: /app
  environment:
    DATABASE_URL: postgresql+psycopg://atlas:atlas@db:5432/atlas
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ./backend:/app:ro

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "atlas", "-d", "atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.worker.main

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY index.html vite.config.js postcss.config.js tailwind.config.js ./
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
    command: npm run dev -- --host 0.0.0.0 --strictPort
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 20

volumes:
  dados:
